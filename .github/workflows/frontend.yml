name: frontend

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements/ci.txt
      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/ci.txt
      - name: Compile final release
        run: |
          python -m py_compile src/integration/*.py src/experiment/*.py src/frontend/*.py run_frontend.py run_integrated_demo.py run_final_benchmark.py
      - name: Run non-RL CI suite
        run: |
          python -m pytest tests/test_temporal_router.py tests/test_integration.py tests/test_frontend_bundle.py tests/test_stochastic_transfer.py tests/test_stochastic_benchmark.py tests/test_final_experiment_spec.py -q
