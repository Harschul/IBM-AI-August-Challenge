name: frontend-integration

on:
  push:
    branches: [ main, integration/**, feature/** ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-integration.txt ]; then pip install -r requirements-integration.txt; fi
          pip install -r requirements-frontend.txt

      - name: Run tests
        run: |
          python -m pytest tests/test_temporal_router.py tests/test_integration.py tests/test_frontend_bundle.py -q
